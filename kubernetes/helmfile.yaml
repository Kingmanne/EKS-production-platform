# Bootstrap only: installs Argo CD. Everything else is an Argo CD Application
# in kubernetes/argocd/apps/ (app-of-apps via kubernetes/argocd/root.yaml).
#   helmfile -f kubernetes/helmfile.yaml apply
#   kubectl apply -f kubernetes/argocd/root.yaml
repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm

helmDefaults:
  wait: true
  timeout: 600
  createNamespace: true

releases:
  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: 10.15.0
    values:
      - helm-values/argocd.yaml
