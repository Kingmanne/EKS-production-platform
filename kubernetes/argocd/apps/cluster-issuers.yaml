apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-issuers
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Kingmanne/EKS-production-platform.git
    targetRevision: main
    path: kubernetes/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true   # on a fresh cluster the CRD may not exist yet
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
