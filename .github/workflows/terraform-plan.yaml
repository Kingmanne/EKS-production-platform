name: terraform-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform-plan.yaml"
      - ".github/workflows/terraform-apply.yaml"

permissions:
  id-token: write        # request the OIDC token
  contents: read         # checkout the code
  pull-requests: write   # comment the plan on the PR

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.17.1"

jobs:
  plan:
    name: Lint, scan and plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -recursive -check

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Checkov
        run: |
          pipx install checkov==3.4.3
          checkov -d . --framework terraform --compact --quiet

      - name: Configure AWS credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -lock-timeout=120s -out=tfplan | tee plan.txt

      - name: Post plan to PR and job summary
        if: always() && steps.plan.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          SUMMARY=$(grep -E '^(Plan:|No changes)' plan.txt || echo "Plan did not complete - see the logs")
          {
            echo "### Terraform plan: ${PLAN_OUTCOME}"
            echo
            echo "**${SUMMARY}**"
            echo
            echo "<details><summary>Show full plan</summary>"
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --body-file comment.md
